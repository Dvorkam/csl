repos:
  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: license header (Python)
        files: \.py$
        exclude: |
          (?x)^(
            tests/|
            .*/migrations/|
            .*/__init__\.py$
          )
        args:
          - --license-filepath=.license-header
          - --comment-style=#

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        name: ruff (fix)
        args: [--fix]
      - id: ruff-format
      - id: ruff
        name: ruff (check)
        # Hard gate: no --fix so this mirrors `ruff check .` in CI exactly.
        # The fix hook above exits 0 after applying fixes even when unfixable
        # errors (e.g. E501) remain; this hook catches those.
        args: []

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types: [python]
        pass_filenames: false
        args: [control_station_lite]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.37.0
    hooks:
      - id: yamllint
        args: [-d, relaxed]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck
