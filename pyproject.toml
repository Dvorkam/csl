[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "control-station-lite"
# Dev placeholder. The published version comes from the pushed git tag —
# release.yml overrides this line at build time. See docs/agent_ref/workflow.md.
version = "0.1.2"
description = "A lightweight self-hosted web service for controlling LAN machines"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0.0",
    "fastapi>=0.136.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.46.0",
]

[project.optional-dependencies]
server = [
    "aiosqlite>=0.22.1",
    "alembic>=1.18.4",
    "asyncssh>=2.23.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "bcrypt>=4.0",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.9",
    "sqlalchemy[asyncio]>=2.0.49",
]
# agent has no extra runtime deps beyond the shared base; this extra exists to
# signal install intent: `pip install control-station-lite[agent]`
agent = []

[project.scripts]
csl-server = "control_station_lite.server.main:main"
csl-agent  = "control_station_lite.agent.cli:main"
csl-admin  = "control_station_lite.server.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff==0.15.12",
    "types-pyyaml>=6.0.12.20260510",
]
test = [
    "httpx>=0.27",
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "schemathesis>=3.38",
]

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
# ---------------------------------------------------------------------------
# setuptools — restrict auto-discovery to the one distribution package
# ---------------------------------------------------------------------------
[tool.setuptools.packages.find]
include = ["control_station_lite*"]

[tool.setuptools.package-data]
"control_station_lite.server" = ["templates/**/*", "static/**/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "PT"]
ignore = ["B008"]   # FastAPI Depends() in function defaults is idiomatic

[tool.ruff.lint.isort]
known-first-party = ["control_station_lite"]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "control_station_lite.shared.*"
strict = true

[[tool.mypy.overrides]]
module = [
    "asyncssh.*",
    "jose.*",
]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
norecursedirs = ["tests/manual"]
addopts = "--cov=control_station_lite --cov-report=term-missing"
markers = [
    "linux_only: test runs on Linux only — skipped on other platforms",
    "windows_only: test runs on Windows only — skipped on other platforms",
]

[tool.coverage.run]
branch = true
source = ["control_station_lite"]
omit = ["*/agent/__main__.py"]
concurrency = ["thread", "greenlet"]

[tool.coverage.report]
# Exclusions documented here per AGENTS.md; 85% line coverage enforced in CI
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.\\s*$",
]
