name: E2E

# Runs on every PR so e2e failures are caught before merge, not after.
#
# REVISIT: if e2e wall-clock time regularly exceeds ~10 minutes, introduce a
# `dev` staging branch — PRs target `dev` (CI only), and a `dev`→`main` PR
# triggers the full suite as the release gate. See docs/agent_ref/workflow.md.

on:
  pull_request:

jobs:
  e2e:
    name: e2e / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install all dependencies (server + agent + test)
        run: uv sync --all-extras --all-groups

      # Linux only: the shipped prod image is a Linux container the Windows
      # runner can't build. Fast-fail smoke check that deploy/docker-compose.yml
      # still builds; the Docker-stack e2e test self-skips off Linux.
      - name: Build production compose image
        if: runner.os == 'Linux'
        run: docker compose -f deploy/docker-compose.yml build

      - name: Run e2e test suite
        # Linux: in-process linux_only flows + test_docker_stack.py (real
        # app+nginx stack over the network). Windows: the windows_only agent
        # flows (real PowerShell execution); the Docker-stack test self-skips.
        run: uv run pytest tests/e2e -v --no-cov
