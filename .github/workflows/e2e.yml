name: E2E

# Runs on every PR so e2e failures are caught before merge, not after.
#
# REVISIT: if e2e wall-clock time regularly exceeds ~10 minutes, introduce a
# `dev` staging branch — PRs target `dev` (CI only), and a `dev`→`main` PR
# triggers the full suite as the release gate. See docs/agent_ref/workflow.md.

on:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install all dependencies (server + agent + test)
        run: uv sync --all-extras --all-groups

      # Fast-fail smoke check for the shipped production compose file: it must
      # still build. The e2e suite below brings the stack up via its own
      # generated compose, so this is the only step that exercises
      # deploy/docker-compose.yml itself.
      - name: Build production compose image
        run: docker compose -f deploy/docker-compose.yml build

      - name: Run e2e test suite
        # In-process suites (approval/job flow) plus test_docker_stack.py, which
        # builds the prod image and drives the real app+nginx stack over the
        # network via docker compose. Linux-only; auto-skips with no Docker daemon.
        run: uv run pytest tests/e2e -v --no-cov
