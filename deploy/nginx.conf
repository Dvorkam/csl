# Control station edge config. Mounted at /etc/nginx/conf.d/default.conf, so
# everything here lives in nginx's `http` context.
#
# nginx owns edge concerns only: TLS termination, rate limiting on the auth
# endpoints, and request-size limits. The app (uvicorn) is never published
# directly — it is reachable only over the internal compose network as `app`.
#
# Certificates are provisioned by scripts/setup.sh into
# /var/lib/control-station-lite/certs and mounted read-only at /etc/nginx/certs.
# Replace the self-signed pair with a real cert/key at the same paths.

# Throttle credential endpoints to blunt brute-force / token-grinding. 5 req/s
# per client IP, with a small burst absorbed without delay.
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

# Redirect plain HTTP to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;

    # Cap request bodies. Script content and registration bundles are small;
    # 2 MB is comfortably above anything legitimate and well below an abuse vector.
    client_max_body_size 2m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # Auth endpoints: rate-limited. burst=10 smooths brief login retries;
    # nodelay serves the burst immediately rather than queuing it.
    location /api/auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $http_x_request_id;
    }

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $http_x_request_id;

        # Server-Sent Events (live job logs): disable buffering so events reach
        # the browser immediately, and allow long-lived idle connections.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
